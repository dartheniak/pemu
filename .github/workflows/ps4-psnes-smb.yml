name: ps4-psnes-smb

# Builds only pSNES for PS4 and uploads the .pkg so it can be downloaded
# from the workflow run page (Actions tab -> run -> Artifacts).
on:
  workflow_dispatch:

jobs:
  build-psnes-ps4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt -yq update
          sudo apt -yq install git build-essential cmake zip \
            pacman-package-manager makepkg libarchive-tools autoconf libtool \
            cmake nasm git curl

      - name: Install ps4 toolchain
        run: |
          sudo tee -a /etc/pacman.conf > /dev/null <<EOT
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          EOT
          sudo pacman -Syu
          sudo pacman --noconfirm -S ps4-openorbis ps4-openorbis-portlibs

      - name: Configure
        run: |
          mkdir cmake-build && cd cmake-build
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          cmake -G "Unix Makefiles" -DPLATFORM_PS4=ON -DOPTION_SMB=ON -DCMAKE_BUILD_TYPE=Release ..

      - name: Build psnes
        run: |
          cd cmake-build
          make psnes_pkg
          mv *.pkg $GITHUB_WORKSPACE

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: psnes-ps4-smb
          path: '*.pkg'
