name: ps4-pppemu

# Builds pppEmu for PS4 (the launcher with Super Nintendo, plus the Genesis, NES, Game Boy and
# arcade programs) and uploads the .pkg: Actions tab -> run -> Artifacts.
# Run it by hand (Run workflow). FBNeo makes it a long build.
on:
  workflow_dispatch:

jobs:
  build-pppemu-ps4:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt -yq update
          sudo apt -yq install git build-essential cmake zip perl \
            pacman-package-manager makepkg libarchive-tools autoconf libtool \
            cmake nasm git curl

      - name: Install ps4 toolchain
        run: |
          sudo tee -a /etc/pacman.conf > /dev/null <<EOT
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          EOT
          sudo pacman -Syu
          sudo pacman --noconfirm -S ps4-openorbis ps4-openorbis-portlibs

      - name: Configure
        run: |
          mkdir cmake-build && cd cmake-build
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          cmake -G "Unix Makefiles" -DPLATFORM_PS4=ON -DOPTION_SMB=ON -DCMAKE_BUILD_TYPE=Release ..

      - name: Build pppEmu
        run: |
          cd cmake-build
          make -j$(nproc) psnes_pkg
          mv *.pkg $GITHUB_WORKSPACE

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: pppemu-ps4
          path: '*.pkg'
